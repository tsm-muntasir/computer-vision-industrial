
name: Publish Industrial Anomaly API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check syntax
        run: |
          python -m compileall -q api src tests

      - name: Run tests
        run: |
          python -m pytest tests -v

  publish:
    name: Build and publish Docker image
    needs: test
    runs-on: ubuntu-latest

    # Publish only from this repository's main branch or a manual run
    # targeting main. Pull requests do not publish images.
    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify inference artifacts
        run: |
          test -f artifacts/autoencoder_best.pth || {
            echo "::error::Missing artifacts/autoencoder_best.pth"
            echo "Make the checkpoint available to the runner before building."
            exit 1
          }

          test -f reports/localization_metrics.json || {
            echo "::error::Missing reports/localization_metrics.json"
            echo "Make the evaluation report available to the runner."
            exit 1
          }

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
