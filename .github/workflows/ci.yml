
name: Industrial Anomaly Detection CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q api src tests

      - name: Run unit tests
        run: |
          python -m pytest tests -v

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check model artifacts
        id: artifacts
        shell: bash
        run: |
          if [[ -f artifacts/autoencoder_best.pth && \
                -f reports/localization_metrics.json ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Model checkpoint or evaluation report is missing."
            echo "Docker build will be skipped until artifacts are available."
          fi

      - name: Set up Docker Buildx
        if: steps.artifacts.outputs.ready == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        if: steps.artifacts.outputs.ready == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: industrial-anomaly-api:ci
